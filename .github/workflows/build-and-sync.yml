name: Build and sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Sync upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Merge upstream main when needed
        shell: bash
        run: |
          set -euo pipefail

          target_branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/YuKongA/Mishka.git
          git fetch origin "${target_branch}"
          git fetch upstream main --no-tags
          git checkout -B "${target_branch}" "origin/${target_branch}"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "The fork is already up to date with upstream/main."
            exit 0
          fi

          echo "Merging upstream/main into ${target_branch}."
          git merge --no-edit upstream/main
          git push origin "HEAD:${target_branch}"

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: sync-upstream
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "ndk;27.2.12479018"

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('app/src/main/native/mishka_core/go.sum', 'mihomo/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mishka-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mishka-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

